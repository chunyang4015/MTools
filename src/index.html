<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTools</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="search-view">
      <div id="search-bar">
        <span class="search-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span>
        <input type="text" id="search-input" placeholder="搜索功能/粘贴文件、图片" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus>
      </div>
      <div id="search-results"></div>
    </div>
    <div id="tool-view" class="hidden">
      <div id="tab-bar">
        <div id="tab-items"></div>
        <button id="pin-btn" title="置顶窗口"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button>
      </div>
      <div id="tool-content"></div>
      <div id="tool-toolbar"></div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
